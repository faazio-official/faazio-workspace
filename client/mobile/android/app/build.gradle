apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * Release signing is PER PRODUCT (all gitignored, restored in CI by
 * scripts/restore-keystore.sh <app>):
 *   customer -> keystore/keystore.properties           (faazio-release.keystore)
 *   delivery -> keystore/keystore-delivery.properties  (faazio-delivery-release.keystore)
 *   seller   -> keystore/keystore-seller.properties    (faazio-seller-release.keystore)
 * Separate keys keep the blast radius of a leaked/misused key to a single app.
 * Never hardcode secrets here.
 */
def keystoreDir = rootProject.file("../keystore")
def loadKeystore = { String fileName ->
    def f = new File(keystoreDir, fileName)
    if (!f.exists()) return null
    def p = new Properties()
    f.withInputStream { stream -> p.load(stream) }
    return p
}
def customerKeystore = loadKeystore("keystore.properties")
def deliveryKeystore = loadKeystore("keystore-delivery.properties")
def sellerKeystore = loadKeystore("keystore-seller.properties")

// Which product is being built: the flavor named in the task (CI always names it, e.g.
// assembleSellerRelease), else APP_VARIANT. Used to pick the right release keystore.
def resolveApp = {
    def names = gradle.startParameter.taskNames.collect { it.toLowerCase() }
    if (names.any { it.contains("delivery") }) return "delivery"
    if (names.any { it.contains("seller") }) return "seller"
    if (names.any { it.contains("customer") }) return "customer"
    def envApp = (System.getenv("APP_VARIANT") ?: "").toLowerCase()
    if (["customer", "delivery", "seller"].contains(envApp)) return envApp
    return null
}
def releaseTask = gradle.startParameter.taskNames.find { it.toLowerCase().contains("release") }
def releaseApp = releaseTask ? resolveApp() : null

// Fail fast: a release task must name a flavor and find that product's keystore — never ship an
// unsigned or debug-signed release.
if (releaseTask) {
    if (releaseApp == null) {
        throw new GradleException(
            "[signing] release task '${releaseTask}' must name a flavor (Customer|Delivery|Seller) " +
            "so the right keystore is selected."
        )
    }
    def keystore = releaseApp == "customer" ? customerKeystore : releaseApp == "delivery" ? deliveryKeystore : sellerKeystore
    if (keystore == null) {
        throw new GradleException(
            "[signing] missing release keystore for '${releaseApp}'. Run " +
            "scripts/restore-keystore.sh ${releaseApp} (or create keystore/keystore[-app].properties) first."
        )
    }
}

/**
 * One native shell, three JS entry points. `delivery` bundles `index.delivery.js`, `seller` bundles
 * `index.seller.js`, and `customer` bundles `index.js`, so each product's screens/stores never reach
 * another APK. The task name (CI builds `assembleDelivery*`/`assembleSeller*` explicitly) or
 * `APP_VARIANT`/`ENTRY_FILE` selects the entry.
 */
def requestedEntry = System.getenv("ENTRY_FILE")
if (!requestedEntry) {
    def deliveryBuild =
        System.getenv("APP_VARIANT") == "delivery" ||
        gradle.startParameter.taskNames.any { it.toLowerCase().contains("delivery") }
    def sellerBuild =
        System.getenv("APP_VARIANT") == "seller" ||
        gradle.startParameter.taskNames.any { it.toLowerCase().contains("seller") }
    requestedEntry = deliveryBuild ? "index.delivery.js" : (sellerBuild ? "index.seller.js" : "index.js")
}

/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
    entryFile = file("../../${requestedEntry}")
}

def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: 'true').toBoolean()
def enableShrinkResources = (findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'true').toBoolean()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.faazio.customer'
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Fallback only: CI derives versionCode/versionName from the semver at build time
        // (1.0.5 -> 10005). Keep this in sync when bumping the release version.
        versionCode 10005
        versionName "1.0.5"

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }

    /**
     * Three separate products from one committed native shell. `customer` is the SuperApp;
     * `delivery` is the standalone Delivery Partner app (its own Play listing, applicationId and
     * label), as is `seller` (Seller Partner app). Build them explicitly —
     * `assembleCustomerDebug` / `assembleDeliveryDebug` / `assembleSellerDebug` — so a partner
     * flavor never drags its Firebase config into a customer build. The JS root follows
     * `APP_VARIANT=delivery` / `=seller` (see scripts/configure.js).
     */
    flavorDimensions 'app'
    productFlavors {
        customer {
            dimension 'app'
            applicationId 'com.faazio.customer'
            resValue 'string', 'app_name', 'Faazio'
        }
        delivery {
            dimension 'app'
            applicationId 'com.faazio.deliverypartner'
            resValue 'string', 'app_name', 'Faazio Delivery Partner'
        }
        seller {
            dimension 'app'
            applicationId 'com.faazio.sellerpartner'
            resValue 'string', 'app_name', 'Faazio Seller Partner'
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (customerKeystore) {
            releaseCustomer {
                // STORE_FILE is relative to android/app/ (e.g. ../../keystore/faazio-release.keystore).
                storeFile file(customerKeystore['STORE_FILE'] ?: '../../keystore/faazio-release.keystore')
                storePassword customerKeystore['KEYSTORE_PASS']
                keyAlias customerKeystore['KEY_ALIAS']
                keyPassword customerKeystore['ALIAS_PASS']
            }
        }
        if (deliveryKeystore) {
            releaseDelivery {
                storeFile file(deliveryKeystore['STORE_FILE'] ?: '../../keystore/faazio-delivery-release.keystore')
                storePassword deliveryKeystore['KEYSTORE_PASS']
                keyAlias deliveryKeystore['KEY_ALIAS']
                keyPassword deliveryKeystore['ALIAS_PASS']
            }
        }
        if (sellerKeystore) {
            releaseSeller {
                storeFile file(sellerKeystore['STORE_FILE'] ?: '../../keystore/faazio-seller-release.keystore')
                storePassword sellerKeystore['KEYSTORE_PASS']
                keyAlias sellerKeystore['KEY_ALIAS']
                keyPassword sellerKeystore['ALIAS_PASS']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Each product signs with its own keystore. Assigning it on the build type (from the
            // flavor named in the release task) avoids any buildType-vs-flavor precedence
            // ambiguity — a release invocation always targets exactly one flavor.
            if (releaseApp == 'delivery') {
                signingConfig signingConfigs.releaseDelivery
            } else if (releaseApp == 'seller') {
                signingConfig signingConfigs.releaseSeller
            } else if (releaseApp == 'customer') {
                signingConfig signingConfigs.releaseCustomer
            }
            shrinkResources enableShrinkResources
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    // Native launch theme (windowSplashScreen*).
    implementation("androidx.core:core-splashscreen:1.0.1")

    implementation("com.facebook.react:hermes-android")
}
