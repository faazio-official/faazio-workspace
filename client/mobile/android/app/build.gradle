import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * Per-app release versions — `../app-versions.json` is the single source of truth (the three
 * products ship on independent schedules, so a shared package.json version is wrong: a customer
 * bump must never move the delivery/seller versionName or versionCode). The CI release workflow
 * rewrites this file for the app being released; bump it by hand for a local release build.
 * Each app's versionCode must strictly increase; a brand-new listing starts at 1.
 */
def appVersionsFile = rootProject.file("../app-versions.json")
if (!appVersionsFile.exists()) {
    throw new GradleException("[version] missing ${appVersionsFile} — per-app versions live there.")
}
def appVersions = new JsonSlurper().parse(appVersionsFile)
def appVersionOf = { String app, String field ->
    def entry = appVersions[app]
    if (entry == null || entry[field] == null) {
        throw new GradleException("[version] app-versions.json has no '${app}.${field}' entry.")
    }
    return entry[field]
}

/**
 * Release signing is PER PRODUCT (all gitignored, restored in CI by
 * scripts/restore-keystore.sh <app>):
 *   customer -> keystore/keystore.properties           (faazio-release.keystore)
 *   delivery -> keystore/keystore-delivery.properties  (faazio-delivery-release.keystore)
 *   seller   -> keystore/keystore-seller.properties    (faazio-seller-release.keystore)
 * Separate keys keep the blast radius of a leaked/misused key to a single app.
 * Never hardcode secrets here.
 */
def keystoreDir = rootProject.file("../keystore")
def loadKeystore = { String fileName ->
    def f = new File(keystoreDir, fileName)
    if (!f.exists()) return null
    def p = new Properties()
    f.withInputStream { stream -> p.load(stream) }
    return p
}
def customerKeystore = loadKeystore("keystore.properties")
def deliveryKeystore = loadKeystore("keystore-delivery.properties")
def sellerKeystore = loadKeystore("keystore-seller.properties")

// Which product is being built: the flavor named in the task (CI always names it, e.g.
// assembleSellerRelease), else APP_VARIANT. Used to pick the right release keystore.
def resolveApp = {
    def names = gradle.startParameter.taskNames.collect { it.toLowerCase() }
    if (names.any { it.contains("delivery") }) return "delivery"
    if (names.any { it.contains("seller") }) return "seller"
    if (names.any { it.contains("customer") }) return "customer"
    def envApp = (System.getenv("APP_VARIANT") ?: "").toLowerCase()
    if (["customer", "delivery", "seller"].contains(envApp)) return envApp
    return null
}
def releaseTask = gradle.startParameter.taskNames.find { it.toLowerCase().contains("release") }
def releaseApp = releaseTask ? resolveApp() : null

// Fail fast: a release task must name a flavor and find that product's keystore — never ship an
// unsigned or debug-signed release.
if (releaseTask) {
    if (releaseApp == null) {
        throw new GradleException(
            "[signing] release task '${releaseTask}' must name a flavor (Customer|Delivery|Seller) " +
            "so the right keystore is selected."
        )
    }
    def keystore = releaseApp == "customer" ? customerKeystore : releaseApp == "delivery" ? deliveryKeystore : sellerKeystore
    if (keystore == null) {
        throw new GradleException(
            "[signing] missing release keystore for '${releaseApp}'. Run " +
            "scripts/restore-keystore.sh ${releaseApp} (or create keystore/keystore[-app].properties) first."
        )
    }
}

/**
 * One native shell, three JS entry points. `delivery` bundles `index.delivery.js`, `seller` bundles
 * `index.seller.js`, and `customer` bundles `index.js`, so each product's screens/stores never reach
 * another APK. The task name (CI builds `assembleDelivery*`/`assembleSeller*` explicitly) or
 * `APP_VARIANT`/`ENTRY_FILE` selects the entry.
 */
def requestedEntry = System.getenv("ENTRY_FILE")
if (!requestedEntry) {
    def deliveryBuild =
        System.getenv("APP_VARIANT") == "delivery" ||
        gradle.startParameter.taskNames.any { it.toLowerCase().contains("delivery") }
    def sellerBuild =
        System.getenv("APP_VARIANT") == "seller" ||
        gradle.startParameter.taskNames.any { it.toLowerCase().contains("seller") }
    requestedEntry = deliveryBuild ? "index.delivery.js" : (sellerBuild ? "index.seller.js" : "index.js")
}

/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
    entryFile = file("../../${requestedEntry}")
}

def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: 'true').toBoolean()
def enableShrinkResources = (findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'true').toBoolean()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.faazio.customer'
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionName/versionCode are PER FLAVOR (see productFlavors below) — each product has its
        // own release cadence, tracked in app-versions.json.

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }

    /**
     * Three separate products from one committed native shell. `customer` is the SuperApp;
     * `delivery` is the standalone Delivery Partner app (its own Play listing, applicationId and
     * label), as is `seller` (Seller Partner app). Build them explicitly —
     * `assembleCustomerDebug` / `assembleDeliveryDebug` / `assembleSellerDebug` — so a partner
     * flavor never drags its Firebase config into a customer build. The JS root follows
     * `APP_VARIANT=delivery` / `=seller` (see scripts/configure.js).
     */
    flavorDimensions 'app'
    productFlavors {
        customer {
            dimension 'app'
            applicationId 'com.faazio.customer'
            resValue 'string', 'app_name', 'Faazio'
            versionName appVersionOf('customer', 'version')
            versionCode appVersionOf('customer', 'versionCode') as int
        }
        delivery {
            dimension 'app'
            applicationId 'com.faazio.deliverypartner'
            resValue 'string', 'app_name', 'Faazio Delivery Partner'
            versionName appVersionOf('delivery', 'version')
            versionCode appVersionOf('delivery', 'versionCode') as int
        }
        seller {
            dimension 'app'
            applicationId 'com.faazio.sellerpartner'
            resValue 'string', 'app_name', 'Faazio Seller Partner'
            versionName appVersionOf('seller', 'version')
            versionCode appVersionOf('seller', 'versionCode') as int
        }
    }

    signingConfigs {
        // Debug signing is PER PRODUCT, mirroring the per-product release keys. Each debug
        // keystore is committed (password `android`, alias `androiddebugkey`) so CI and every
        // developer produce the same cert per app — a debug APK must keep the same signature
        // across machines or Firebase rejects the app-identifier check for phone OTP.
        //   customer -> debug.keystore          (com.faazio.customer)
        //   delivery -> debug-delivery.keystore (com.faazio.deliverypartner)
        //   seller   -> debug-seller.keystore   (com.faazio.sellerpartner)
        debugCustomer {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        debugDelivery {
            storeFile file('debug-delivery.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        debugSeller {
            storeFile file('debug-seller.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (customerKeystore) {
            releaseCustomer {
                // STORE_FILE is relative to android/app/ (e.g. ../../keystore/faazio-release.keystore).
                storeFile file(customerKeystore['STORE_FILE'] ?: '../../keystore/faazio-release.keystore')
                storePassword customerKeystore['KEYSTORE_PASS']
                keyAlias customerKeystore['KEY_ALIAS']
                keyPassword customerKeystore['ALIAS_PASS']
            }
        }
        if (deliveryKeystore) {
            releaseDelivery {
                storeFile file(deliveryKeystore['STORE_FILE'] ?: '../../keystore/faazio-delivery-release.keystore')
                storePassword deliveryKeystore['KEYSTORE_PASS']
                keyAlias deliveryKeystore['KEY_ALIAS']
                keyPassword deliveryKeystore['ALIAS_PASS']
            }
        }
        if (sellerKeystore) {
            releaseSeller {
                storeFile file(sellerKeystore['STORE_FILE'] ?: '../../keystore/faazio-seller-release.keystore')
                storePassword sellerKeystore['KEYSTORE_PASS']
                keyAlias sellerKeystore['KEY_ALIAS']
                keyPassword sellerKeystore['ALIAS_PASS']
            }
        }
    }

    buildTypes {
        debug {
            // Per-product debug keystore, selected exactly like the release key below: from the
            // flavor named in the task, else APP_VARIANT. Assigning it on the build type (rather
            // than the flavor) keeps one mechanism and one precedence rule for both build types.
            // Falls back to customer for an unnamed `assembleDebug`, matching the pre-existing
            // single-keystore behaviour; CI and npm scripts always name the flavor.
            def debugApp = resolveApp() ?: 'customer'
            if (debugApp == 'delivery') {
                signingConfig signingConfigs.debugDelivery
            } else if (debugApp == 'seller') {
                signingConfig signingConfigs.debugSeller
            } else {
                signingConfig signingConfigs.debugCustomer
            }
            // The two build types are explicitly labelled in the binary so the app (and a CI log)
            // can tell a debug/Metro shell from a prod/embedded one without guessing from flags.
            buildConfigField "String", "BUILD_VARIANT", '"debug"'
            buildConfigField "boolean", "DEBUG_BUILD", "true"
        }
        release {
            // Each product signs with its own keystore. Assigning it on the build type (from the
            // flavor named in the release task) avoids any buildType-vs-flavor precedence
            // ambiguity — a release invocation always targets exactly one flavor.
            if (releaseApp == 'delivery') {
                signingConfig signingConfigs.releaseDelivery
            } else if (releaseApp == 'seller') {
                signingConfig signingConfigs.releaseSeller
            } else if (releaseApp == 'customer') {
                signingConfig signingConfigs.releaseCustomer
            } else {
                // Reached only for non-release tasks: this block configures on every build. A
                // release task with no product is already rejected by the fail-fast block at the
                // top of this file, so a release build can never fall through to a flavor's
                // debug keystore.
                logger.info("[signing] no release product selected; release signingConfig left unset")
            }
            buildConfigField "String", "BUILD_VARIANT", '"prod"'
            buildConfigField "boolean", "DEBUG_BUILD", "false"
            shrinkResources enableShrinkResources
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    // Native launch theme (windowSplashScreen*).
    implementation("androidx.core:core-splashscreen:1.0.1")
    // OS "Turn on location" resolution dialog; see FaazioGeocoderModule.kt requestEnableLocation.
    implementation("com.google.android.gms:play-services-location:21.3.0")

    implementation("com.facebook.react:hermes-android")
}
