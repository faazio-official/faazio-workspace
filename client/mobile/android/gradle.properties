# Project-wide Gradle settings.

# Laptop caps: avoid systemd-oomd kills on this dev machine. CI overrides these
# in ~/.gradle/gradle.properties (see docs/RUNBOOKS/CI_PIPELINE.md).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.workers.max=2

android.useAndroidX=true

# AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Default ABI (override with -PreactNativeArchitectures=...)
reactNativeArchitectures=arm64-v8a

# New Architecture (Fabric + TurboModules)
newArchEnabled=true

# Hermes JS engine
hermesEnabled=true

# Draw behind system bars (ReactActivity edge-to-edge)
edgeToEdgeEnabled=true
