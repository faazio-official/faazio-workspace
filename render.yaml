# Render Blueprint for the Faazio production gateway (Go Chi modular monolith).
# Docs: docs/architecture/mvp-backend.md, server/README.md.
#
# Deploy: connect this repo in Render → "New" → "Blueprint" (Render reads this file at the repo root).
# Set every environment variable in the Render dashboard (Environment tab) — nothing env-related
# is committed here. The gateway reads Render's injected PORT automatically, and falls back to
# RENDER_EXTERNAL_URL for PUBLIC_BASE_URL, so only the config/secrets below need adding:
#   DATABASE_URL, VALKEY_URL, MONGO_URI, FIREBASE_PROJECT_ID, SUPABASE_SERVICE_KEY,
#   SUPABASE_JWT_SECRET (legacy portal tokens), SUPABASE_URL,
#   FCM_PROJECT_ID (declared here) + FCM_SERVICE_ACCOUNT_JSON (secret, dashboard-only) if the
#   embedded FCM push sender is used (Android push),
#   PORTAL_JWT_SECRET (openssl rand -base64 48), PORTAL_PEPPER (openssl rand -base64 32) — gateway-native
#   portal auth (migrations 0032 + 0033); provisioning: docs/RUNBOOKS/PORTAL_AUTH.md,
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#   GOOGLE_ROUTES_API_KEY (server-side Routes API key for road-aware delivery dispatch; optional —
#   unset means the straight-line fallback), DELIVERY_MAX_DISPATCH_ATTEMPTS (default 5),
#   MONGO_DATABASE=faazio, PRESCRIPTION_BUCKET=prescriptions,
#   SUPABASE_URL=https://mivisyjvvizyyidjdjmh.supabase.co,
#   R2_ACCOUNT_ID=28cbf78411f854a8a41a5b737e698004, R2_PUBLIC_BUCKET=faazio-public,
#   R2_PRIVATE_BUCKET=faazio-private, BOOKING_FEE_PAISA=5000, AUTH_DISABLED=false,
#   ALLOWED_ORIGINS=https://app.faazio.com, OTEL_ENABLED=true
#
# Migrations: Render NEVER applies them — the distroless image ships only the /server binary (no
# SQL, no psql), and the gateway just health-checks the schema. Apply server/supabase/migrations/*
# from a dev terminal with server/gateway/.env (docs/RUNBOOKS/DATABASE_MIGRATIONS.md) BEFORE rolling
# this deploy.
#
# Prod hardening (dashboard/Cloudflare, not expressible here):
#   - Cloudflare: CNAME → onrender.com (DNS-only first to issue the cert, then Proxied + SSL Full);
#     delete any AAAA record so clients never reach Render directly.
#   - Render → Inbound Rules: allow only Cloudflare's published IP ranges (origin lock) so the WAF
#     and DDoS protection cannot be bypassed by hitting *.onrender.com.
#   - Pin rotation: 2-pin overlap, rotate ≥30 days before expiry (docs/RUNBOOKS/RELEASE.md).
services:
  - type: web
    name: faazio-gateway
    runtime: docker
    rootDir: server/gateway
    dockerfilePath: ./Dockerfile
    region: singapore
    # standard (not starter): starter spins down on idle and runs a single instance — neither is
    # acceptable for real-money writes. Keep min 2 for a rolling deploy with no cold-start gap.
    plan: standard
    scaling:
      minInstances: 2
      maxInstances: 4
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Firebase phone-OTP ID tokens (mobile). Public project identifier, not a secret:
      # the gateway verifies RS256 signatures against Google's published certificate set.
      - key: FIREBASE_PROJECT_ID
        value: project-65696e12-8def-460e-b29
      # FCM HTTP v1 push sender (Android, server-side). Same Firebase project as FIREBASE_PROJECT_ID;
      # FCM_SERVICE_ACCOUNT_JSON is the generated service-account key (secret → dashboard only, sync:false)
      # — see docs/RUNBOOKS/FIREBASE_AUTH.md "Server-side FCM push credentials".
      - key: FCM_PROJECT_ID
        value: project-65696e12-8def-460e-b29
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      # Routes API (delivery dispatch road time). Server-only key; restrict it to Routes API.
      # Unset is safe: dispatch falls back to a Haversine/urban-speed estimate.
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      # Weather Union (Zomato giveback) rain surge. Key is optional: unset means the provider is
      # disabled and the fee simply has no rain surcharge. Base URL is optional too (official
      # endpoint default).
      - key: ZOMATO_WEATHER_UNION_BASE_URL
        sync: false
      - key: ZOMATO_WEATHER_UNION_KEY
        sync: false
      # Money/Rx writes must never run against an auth-disabled gateway in production.
      - key: AUTH_DISABLED
        value: "false"
      # Required secrets/origins: declared here so a Blueprint deploy is self-documenting and Render
      # flags a missing value, but kept out of git (sync:false = set the value in the dashboard only).
      # Without PORTAL_JWT_SECRET portal login returns 503 portal_auth_unavailable; without the
      # credential tables applied (0032 + 0033) it returns 500 portal_unavailable.
      - key: PORTAL_JWT_SECRET
        sync: false
      - key: PORTAL_PEPPER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VALKEY_URL
        sync: false
      - key: MONGO_URI
        sync: false
      # Exact portal origin (no wildcard). The browser only talks to the portal; keep this in sync
      # with the Vercel deployment origin.
      - key: ALLOWED_ORIGINS
        value: https://app.faazio.com
      # Razorpay Route (seller settlement splits): linked accounts + held transfers + webhook HMAC.
      # Optional — the gateway falls back to the main RAZORPAY_KEY_ID/RAZORPAY_KEY_SECRET and
      # RAZORPAY_WEBHOOK_SECRET when these are unset (see internal/platform/config). With no Route
      # keys the client stays in mock mode and no payout is ever marked PAID without a real transfer,
      # so a deploy without them is safe but non-functional for settlement. Set the Route webhook to
      # https://<gateway>/webhooks/razorpay/route with the secret in the Razorpay dashboard.
      - key: RAZORPAY_ROUTE_KEY_ID
        sync: false
      - key: RAZORPAY_ROUTE_KEY_SECRET
        sync: false
      - key: RAZORPAY_ROUTE_WEBHOOK_SECRET
        sync: false
