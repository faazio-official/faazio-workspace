name: Server Gateway

# Builds, vets, and tests the Go Chi modular monolith (server/gateway). Postgres +
# Valkey service containers back the integration tests (FTS, order lock, rating gate,
# PII redaction, keyset pagination); tests skip gracefully when unset.
# Boundary lint (`tools/importlint`) fails the job on any sibling-context import.
on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-gateway.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-gateway.yml"

permissions:
  contents: read

concurrency:
  group: server-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/gateway

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: faazio
          POSTGRES_DB: faazio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d faazio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: "postgres://postgres:faazio@localhost:5432/faazio?sslmode=disable"
      TEST_VALKEY_URL: "redis://localhost:6379/0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/gateway/go.mod
          cache-dependency-path: server/gateway/go.sum

      - name: Apply migrations + seed
        run: |
          for f in ../supabase/migrations/*.sql; do
            echo "applying $f"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/seed/0001_seed.sql

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Boundary lint
        run: go run ./tools/importlint