name: Release APK

# Builds a release-signed Android APK in CI and publishes it as a GitHub
# Release (replacing any existing APK on that release tag via --clobber).
# Triggered manually so you control when a build runs:
#   gh workflow run release-apk.yml
#   gh run watch
#
# Secrets required (set once via `gh secret set`):
#   KEYSTORE_BASE64  base64 of client/mobile/keystore/faazio-release.keystore
#   KEYSTORE_PASS, KEY_ALIAS, ALIAS_PASS  -> keystore.properties values
#   STORE_FILE       keystore file name (optional, default faazio-release.keystore)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.2) — overrides app.json"
        required: false
        type: string
      tag:
        description: "Git tag for the release (e.g. v1.0.2)"
        required: false
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"
  # ABIs to build into the GitHub-release APK. arm64-v8a + armeabi-v7a covers
  # ~95% of devices while roughly halving native compile work and .so payload
  # vs the 4-ABI universal build. Native work (reanimated/worklets C++) scales
  # linearly with ABI count, so trimming this is the biggest single build-speed
  # and APK-size lever. Override per-run if you need arm64-only (smallest).
  REACT_NATIVE_ARCHS: "arm64-v8a,armeabi-v7a"

# Never run two release builds at once — they share the same tag/artifact names
# and would clobber each other while burning parallel runners.
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Caches ~/.gradle (Maven deps, wrapper dists, transform outputs, and the
      # Gradle build-cache dir) across runs. Without this every run is a cold
      # build that re-downloads ~1-2 GB of Maven artifacts. The build cache also
      # lets unchanged Gradle tasks restore even after `expo prebuild --clean`.
      - name: Cache Gradle + setup Gradle build cache
        uses: gradle/actions/setup-gradle@v4

      # CI-only Gradle tuning. GRADLE_USER_HOME (~/.gradle/gradle.properties)
      # takes precedence over the project's android/gradle.properties, so these
      # override the laptop caps (workers.max=2, -Xmx2048m, parallel=false) that
      # exist only to avoid systemd-oomd kills on this dev machine — without
      # touching the generated file. A 4-vCPU runner × 2 workers leaves the
      # compile phase running below capacity; 4 workers + a 6G heap is safe on
      # GitHub's ubuntu-latest (7 GB RAM, no competing desktop apps).
      - name: Tune Gradle for CI runner
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC
          org.gradle.workers.max=4
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.vfs.watch=false
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Set version (manual override)
        if: ${{ github.event.inputs.version != '' }}
        run: |
          node -e "
            const fs = require('fs');
            const p = require('./app.json');
            p.expo.version = '${{ github.event.inputs.version }}';
            fs.writeFileSync('./app.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Restore keystore + signing properties
        run: bash scripts/restore-keystore.sh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          STORE_FILE: ${{ secrets.STORE_FILE }}

      - name: Generate Android project (prebuild)
        run: npx expo prebuild --clean --platform android

      - name: Wire release signingConfig
        run: bash scripts/configure-release-signing.sh

      - name: Build release APK
        run: |
          cd android
          # R8 minify + resource shrinking ON (via -P, reads the generated
          # app/build.gradle's findProperty) → smaller dex + obfuscation.
          # ABI restricted to REACT_NATIVE_ARCHS → less native work + payload.
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures="$REACT_NATIVE_ARCHS" \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: faazio-${{ github.event.inputs.version || 'release' }}-apk
          path: client/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # R8 mapping.txt is REQUIRED to retrace minified crash stack traces.
      # It must never be attached to the public GitHub Release (it would defeat
      # the obfuscation) — keep it as a private Actions artifact only.
      - name: Upload R8 mapping (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: faazio-mapping-${{ github.run_id }}
          path: client/mobile/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          TAG="v${VERSION}"
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          NOTES="Automated release APK build via GitHub Actions.\n\nVersion: ${VERSION}\n"
          PRERELEASE=""
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            PRERELEASE="--prerelease"
          fi

          # Create the release (idempotent; --clobber replaces existing APK).
          gh release create "$TAG" \
            --title "Faazio ${VERSION}" \
            --notes "$(printf "$NOTES")" \
            $PRERELEASE \
            || true

          # Attach (replace) the APK on the release.
          gh release upload "$TAG" \
            android/app/build/outputs/apk/release/*.apk \
            --clobber

          echo "::notice::Published Faazio ${VERSION} to release ${TAG}"
