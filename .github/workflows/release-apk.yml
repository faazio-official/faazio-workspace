name: Release APK

# Builds a release-signed Android APK in CI and publishes it as a GitHub
# Release (replacing any existing APK on that release tag via --clobber).
# Triggered manually so you control when a build runs:
#   gh workflow run release-apk.yml
#   gh run watch
#
# The committed android/ project is the source of truth — no prebuild step.
#
# Secrets required (set once via `gh secret set`), one set PER PRODUCT
# (suffix _CUSTOMER / _DELIVERY / _SELLER — each app has its own release keystore):
#   KEYSTORE_BASE64_<APP>  base64 of client/mobile/keystore/<app store file>
#   KEYSTORE_PASS_<APP>, KEY_ALIAS_<APP>, ALIAS_PASS_<APP>  -> that app's keystore.properties
#   STORE_FILE_<APP>       (optional) keystore file name; defaults per app
#   CERT_PINS        comma-separated base64 SHA-256 SPKI pins (required when
#                    GATEWAY_URL + USE_GATEWAY=true; release fails without them)
#   USE_GATEWAY      (optional) defaults to true for the Cloudflare-fronted gateway (api.faazio.com)
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Product to build"
        required: true
        type: choice
        options:
          - customer
          - delivery
          - seller
        default: customer
      version:
        description: "Release version (e.g. 1.0.2) — overrides package.json"
        required: false
        type: string
      tag:
        description: "Git tag for the release (e.g. v1.0.2)"
        required: false
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false
      include-aab:
        description: "Also build and attach the AAB for Play Console"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"
  # ABI to build into the release APK/AAB. arm64-v8a only — 64-bit devices — which
  # roughly halves native compile work and .so payload vs a 2-ABI build. Re-add
  # armeabi-v7a here only if 32-bit device support becomes a requirement.
  REACT_NATIVE_ARCHS: "arm64-v8a"

# Never run two release builds at once — they share the same tag/artifact names
# and would clobber each other while burning parallel runners.
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # RN + Gradle + npm need more headroom than the default runner image leaves.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images
          df -h

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle + setup Gradle build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Tune Gradle for CI runner
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC
          org.gradle.workers.max=4
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.vfs.watch=false
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Set version (package.json is the source of truth)
        # Always runs: aligns build.gradle versionName + versionCode to the resolved
        # version. With -f version it also rewrites package.json. This removes the
        # stale-committed-versionCode trap (a no-input dispatch previously shipped the
        # hardcoded versionCode, which could be a downgrade vs a -f version build).
        run: |
          VERSION="${{ github.event.inputs.version }}" node -e "
            const fs = require('fs');
            const p = require('./package.json');
            const version = process.env.VERSION || p.version;
            if (process.env.VERSION) {
              p.version = process.env.VERSION;
              fs.writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');
            }
            // Derive versionCode deterministically from the semver (e.g. 1.0.4 ->
            // 10004). Must strictly increase per release to avoid downgrade installs.
            const parts = String(version).split('.').map(Number);
            let vc = null;
            if (parts.length >= 3 && parts.every((n) => Number.isInteger(n) && n >= 0)) {
              vc = parts[0] * 10000 + parts[1] * 100 + parts[2];
            }
            const g = 'android/app/build.gradle';
            let s = fs.readFileSync(g, 'utf8');
            s = s.replace(/versionName \"[^\"]+\"/, 'versionName \"' + version + '\"');
            if (vc != null) {
              s = s.replace(/versionCode \d+/, 'versionCode ' + vc);
            }
            fs.writeFileSync(g, s);
          "

      - name: Restore keystore + signing properties
        run: bash scripts/restore-keystore.sh "${{ github.event.inputs.app }}"
        env:
          KEYSTORE_BASE64_CUSTOMER: ${{ secrets.KEYSTORE_BASE64_CUSTOMER }}
          KEYSTORE_PASS_CUSTOMER: ${{ secrets.KEYSTORE_PASS_CUSTOMER }}
          KEY_ALIAS_CUSTOMER: ${{ secrets.KEY_ALIAS_CUSTOMER }}
          ALIAS_PASS_CUSTOMER: ${{ secrets.ALIAS_PASS_CUSTOMER }}
          KEYSTORE_BASE64_DELIVERY: ${{ secrets.KEYSTORE_BASE64_DELIVERY }}
          KEYSTORE_PASS_DELIVERY: ${{ secrets.KEYSTORE_PASS_DELIVERY }}
          KEY_ALIAS_DELIVERY: ${{ secrets.KEY_ALIAS_DELIVERY }}
          ALIAS_PASS_DELIVERY: ${{ secrets.ALIAS_PASS_DELIVERY }}
          KEYSTORE_BASE64_SELLER: ${{ secrets.KEYSTORE_BASE64_SELLER }}
          KEYSTORE_PASS_SELLER: ${{ secrets.KEYSTORE_PASS_SELLER }}
          KEY_ALIAS_SELLER: ${{ secrets.KEY_ALIAS_SELLER }}
          ALIAS_PASS_SELLER: ${{ secrets.ALIAS_PASS_SELLER }}

      - name: Delivery Firebase config
        if: ${{ github.event.inputs.app == 'delivery' }}
        env:
          GOOGLE_SERVICES_DELIVERY_JSON: ${{ secrets.GOOGLE_SERVICES_DELIVERY_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_DELIVERY_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_DELIVERY_JSON is not set. Register com.faazio.deliverypartner in Firebase and store its google-services.json as the secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_DELIVERY_JSON" > android/app/src/delivery/google-services.json

      - name: Seller Firebase config
        if: ${{ github.event.inputs.app == 'seller' }}
        env:
          GOOGLE_SERVICES_SELLER_JSON: ${{ secrets.GOOGLE_SERVICES_SELLER_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_SELLER_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_SELLER_JSON is not set. Register com.faazio.sellerpartner in Firebase and store its google-services.json as the secret."
            exit 1
          fi
          mkdir -p android/app/src/seller
          printf '%s' "$GOOGLE_SERVICES_SELLER_JSON" > android/app/src/seller/google-services.json

      - name: Typecheck + module boundaries
        run: |
          npm run ts:check
          npm run check:boundaries
        env:
          # ts:check re-runs configure.js; keep the selected product variant from being reset.
          # Release settings are generated again below with cert pins + restricted keys.
          APP_VARIANT: ${{ github.event.inputs.app }}
          CONFIGURE_PLATFORM: android
          # configure.js fails a seller typecheck without a portal origin. Supply the same
          # gateway/portal values the release config step uses so seller builds pass this gate.
          GATEWAY_URL: ${{ secrets.GATEWAY_URL || 'https://api.faazio.com' }}
          WEB_PORTAL_URL: ${{ vars.WEB_PORTAL_URL || secrets.WEB_PORTAL_URL || 'https://app.faazio.com' }}

      - name: Generate JS/native config (release)
        run: npm run configure
        env:
          CONFIGURE_RELEASE: "1"
          REQUIRE_CERT_PINS: "1"
          CONFIGURE_PLATFORM: android
          GATEWAY_URL: ${{ secrets.GATEWAY_URL || 'https://api.faazio.com' }}
          # Seller builds require a portal origin; the prod portal is the default.
          WEB_PORTAL_URL: ${{ vars.WEB_PORTAL_URL || secrets.WEB_PORTAL_URL || 'https://app.faazio.com' }}
          USE_GATEWAY: ${{ secrets.USE_GATEWAY || 'true' }}
          STRICT: "true"
          USE_FIREBASE_AUTH: "true"
          CERT_PINS: ${{ secrets.CERT_PINS }}
          APP_VARIANT: ${{ github.event.inputs.app }}
          GOOGLE_MAPS_API_KEY_ANDROID: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

      - name: Build release APK (and AAB when include-aab)
        run: |
          cd android
          case "${{ github.event.inputs.app }}" in
            delivery) TASK=assembleDeliveryRelease; BUNDLE=bundleDeliveryRelease ;;
            seller) TASK=assembleSellerRelease; BUNDLE=bundleSellerRelease ;;
            *) TASK=assembleCustomerRelease; BUNDLE=bundleCustomerRelease ;;
          esac
          # R8 minify + resource shrinking ON → smaller dex + obfuscation.
          # ABI restricted to REACT_NATIVE_ARCHS → less native work + payload.
          # The AAB is only built when requested (it powers Google Play uploads;
          # the APK is for direct install / smoke testing). Both are signed with
          # the same release keystore.
          TASKS=( "$TASK" )
          if [[ "${{ github.event.inputs['include-aab'] }}" == "true" ]]; then
            TASKS+=( "$BUNDLE" )
          fi
          ./gradlew "${TASKS[@]}" --no-daemon \
            -PreactNativeArchitectures="$REACT_NATIVE_ARCHS" \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true
        env:
          ENTRY_FILE: ${{ github.event.inputs.app == 'delivery' && 'index.delivery.js' || (github.event.inputs.app == 'seller' && 'index.seller.js' || 'index.js') }}

      # Guard against a silently unsigned release (e.g. a signing-config regression): the
      # APK must verify AND carry a Faazio release certificate.
      - name: Verify release APK is signed
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under ${SDK}/build-tools"
            exit 1
          fi
          APK="$(ls android/app/build/outputs/apk/${{ github.event.inputs.app }}/release/*.apk | head -1)"
          echo "apksigner: $APKSIGNER"; echo "apk: $APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          if ! grep -q "CN=Faazio" /tmp/apksigner.txt; then
            echo "::error::release APK is not signed with a Faazio release certificate"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: faazio-${{ github.event.inputs.app }}-${{ github.event.inputs.version || 'release' }}-apk
          path: client/mobile/android/app/build/outputs/apk/${{ github.event.inputs.app }}/release/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        if: ${{ github.event.inputs['include-aab'] == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: faazio-${{ github.event.inputs.app }}-${{ github.event.inputs.version || 'release' }}-aab
          path: client/mobile/android/app/build/outputs/bundle/${{ github.event.inputs.app }}Release/*.aab
          if-no-files-found: error

      # R8 mapping.txt is REQUIRED to retrace minified crash stack traces.
      # It must never be attached to the public GitHub Release (it would defeat
      # the obfuscation) — keep it as a private Actions artifact only.
      - name: Upload R8 mapping (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: faazio-${{ github.event.inputs.app }}-mapping-${{ github.run_id }}
          path: client/mobile/android/app/build/outputs/mapping/${{ github.event.inputs.app }}Release/mapping.txt
          if-no-files-found: ignore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP="${{ github.event.inputs.app }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$APP" == "delivery" ]]; then
            APP_NAME="Faazio Delivery Partner"
            TAG="v${VERSION}-delivery"
          elif [[ "$APP" == "seller" ]]; then
            APP_NAME="Faazio Seller Partner"
            TAG="v${VERSION}-seller"
          else
            APP_NAME="Faazio"
            TAG="v${VERSION}"
          fi
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          NOTES="Automated ${APP_NAME} APK build via GitHub Actions.\n\nVersion: ${VERSION}\n"
          PRERELEASE=""
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            PRERELEASE="--prerelease"
          fi

          # Create the release (idempotent; --clobber replaces existing APK).
          gh release create "$TAG" \
            --title "${APP_NAME} ${VERSION}" \
            --notes "$(printf "$NOTES")" \
            $PRERELEASE \
            || true

          # Attach (replace) the APK on the release (plus the AAB when requested).
          FILES=( "android/app/build/outputs/apk/${APP}/release/"*.apk )
          if [[ "${{ github.event.inputs['include-aab'] }}" == "true" ]]; then
            FILES+=( "android/app/build/outputs/bundle/${APP}Release/"*.aab )
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber

          echo "::notice::Published ${APP_NAME} ${VERSION} to release ${TAG}"
