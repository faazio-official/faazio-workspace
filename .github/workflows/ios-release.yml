name: Release iOS

# Builds a release-signed iOS .ipa on a GitHub-hosted macOS runner, uploads it to
# TestFlight (App Store Connect API), and optionally attaches it to a GitHub Release
# (replacing any existing .ipa on that tag via --clobber). Triggered manually so you
# control when a build runs:
#   gh workflow run ios-release.yml -f app=customer
#   gh run watch
#
# The committed ios/ Xcode project is the source of truth — no prebuild step.
# Signing uses ONE shared Apple Distribution certificate + one App Store provisioning
# profile per product (no fastlane). Uses Apple's own tooling only.
#
# Required repository secrets (set once via `gh secret set`):
#   APPSTORE_CERTIFICATE_BASE64          base64 of the shared distribution .p12
#   APPSTORE_CERTIFICATE_PASSWORD        .p12 password
#   APPSTORE_PROVISIONING_PROFILE_CUSTOMER  base64 App Store .mobileprovision (com.faazio.customer)
#   APPSTORE_PROVISIONING_PROFILE_DELIVERY  base64 App Store .mobileprovision (com.faazio.deliverypartner)
#   APPSTORE_PROVISIONING_PROFILE_SELLER    base64 App Store .mobileprovision (com.faazio.sellerpartner)
#   APPSTORE_API_PRIVATE_KEY             contents of the App Store Connect AuthKey_*.p8
#   CERT_PINS                           comma-separated base64 SHA-256 SPKI pins (required for release)
#   GOOGLE_PLACES_API_KEY               Places API (New) key for address autocomplete
#   GOOGLE_MAPS_API_KEY_IOS             restricted iOS Maps key (optional)
#   GOOGLE_SERVICE_INFO_DELIVERY_PLIST  base64 Firebase iOS plist for delivery (delivery builds)
#   GOOGLE_SERVICE_INFO_SELLER_PLIST    base64 Firebase iOS plist for seller (seller builds)
# Required repository variables (or secrets):
#   APPSTORE_TEAM_ID                    Apple Developer Team ID
#   APPSTORE_ISSUER_ID                  App Store Connect API issuer ID
#   APPSTORE_API_KEY_ID                 App Store Connect API key ID
# Optional (prod defaults shown):
#   GATEWAY_URL, WEB_PORTAL_URL, USE_GATEWAY
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Product to build"
        required: true
        type: choice
        options:
          - customer
          - delivery
          - seller
        default: customer
      runner:
        description: "Runner pool: macos-15 (arm64, ~3x faster) or macos-15-intel (use when arm64 is capacity-constrained)"
        required: false
        type: choice
        options:
          - macos-15-intel
          - macos-15
        default: macos-15-intel
      version:
        description: "Release version (e.g. 1.0.6) — overrides package.json"
        required: false
        type: string
      tag:
        description: "Git tag for the release (e.g. v1.0.6); blank uses the app convention"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: false
        type: boolean
        default: false
      upload:
        description: "Upload the build to TestFlight"
        required: false
        type: boolean
        default: true
        # NOTE for Linux-only developers: setting this to false skips TestFlight,
        # but there is no official Linux tool to push the .ipa into App Store Connect.
        # Leave it true unless you have a Mac available to handle the .ipa manually.

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  # Pin the Xcode version explicitly; the runner has several installed side by side.
  # Must ship Swift >= 6.2.1: Firebase iOS SDK 13 (via @react-native-firebase 27 + SPM)
  # declares swift-tools-version 6.2.1, which Xcode 16.x (Swift 6.1) cannot resolve.
  XCODE_VERSION: "26.3"

# Never run two release builds at once — they share tag/artifact names.
concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  build-release-ipa:
    # Default to the Intel pool so a release never sits in the arm64 queue and
    # dies with "job was not acquired by Runner of type hosted" (observed on
    # 2026-11-10). When arm64 capacity is healthy, dispatch with
    # `-f runner=macos-15`: native arm64 archives this workspace in ~15 min,
    # while x86_64 macos-15-intel cross-compiles the same archive in ~40-48 min.
    # Xcode 26.3 is installed on both pools.
    runs-on: ${{ github.event.inputs.runner || 'macos-15-intel' }}
    # Guard against a stuck TestFlight upload/archive keeping the job alive forever.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: client/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/mobile/package-lock.json

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          pod --version

      - name: Install dependencies
        run: npm ci

      - name: Set version (package.json + Xcode MARKETING_VERSION/CURRENT_PROJECT_VERSION)
        id: version
        # Aligns the iOS marketing version + build number with the resolved version.
        # Info.plist reads $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION), so this is
        # the single source of truth for the submitted build. With -f version it also
        # rewrites package.json.
        run: |
          VERSION="${{ github.event.inputs.version }}" node -e "
            const fs = require('fs');
            const p = require('./package.json');
            const version = process.env.VERSION || p.version;
            if (process.env.VERSION) {
              p.version = process.env.VERSION;
              fs.writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');
            }
            // App Store Connect requires every upload to have a build number strictly
            // higher than the last one, even when the marketing version is unchanged.
            // A UTC timestamp (YYYYMMDDHHmm) guarantees that across re-runs; a
            // semver-derived number would repeat (1.0.8 -> 10008) and be rejected.
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const vc = String(now.getUTCFullYear()) + pad(now.getUTCMonth() + 1) +
              pad(now.getUTCDate()) + pad(now.getUTCHours()) + pad(now.getUTCMinutes());
            const f = 'ios/Faazio.xcodeproj/project.pbxproj';
            let s = fs.readFileSync(f, 'utf8');
            s = s.replace(/MARKETING_VERSION = [^;]+;/g, 'MARKETING_VERSION = ' + version + ';');
            s = s.replace(/CURRENT_PROJECT_VERSION = \d+;/g, 'CURRENT_PROJECT_VERSION = ' + vc + ';');
            fs.writeFileSync(f, s);
            console.log('MARKETING_VERSION=' + version + ' CURRENT_PROJECT_VERSION=' + vc);
            if (process.env.GITHUB_OUTPUT) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build_number=' + vc + '\n');
            }
          "

      - name: Delivery Firebase config
        if: ${{ github.event.inputs.app == 'delivery' }}
        env:
          GOOGLE_SERVICE_INFO_DELIVERY_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_DELIVERY_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_DELIVERY_PLIST" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_DELIVERY_PLIST is not set. Register com.faazio.deliverypartner in Firebase and store its GoogleService-Info plist as base64."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_DELIVERY_PLIST" | base64 --decode > ios/Faazio/GoogleService-Info-Delivery.plist

      - name: Seller Firebase config
        if: ${{ github.event.inputs.app == 'seller' }}
        env:
          GOOGLE_SERVICE_INFO_SELLER_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_SELLER_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_SELLER_PLIST" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_SELLER_PLIST is not set. Register com.faazio.sellerpartner in Firebase and store its GoogleService-Info plist as base64."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_SELLER_PLIST" | base64 --decode > ios/Faazio/GoogleService-Info-Seller.plist

      - name: Typecheck + module boundaries + UI hygiene
        run: |
          npm run ts:check
          npm run check:boundaries
          npm run check:ui
        env:
          # ts:check re-runs configure.js; keep the selected product variant from being reset.
          APP_VARIANT: ${{ github.event.inputs.app }}
          CONFIGURE_PLATFORM: ios
          GATEWAY_URL: ${{ secrets.GATEWAY_URL || 'https://api.faazio.com' }}
          WEB_PORTAL_URL: ${{ vars.WEB_PORTAL_URL || secrets.WEB_PORTAL_URL || 'https://app.faazio.com' }}

      - name: Generate JS/native config (release)
        run: npm run configure
        env:
          CONFIGURE_RELEASE: "1"
          REQUIRE_CERT_PINS: "1"
          CONFIGURE_PLATFORM: ios
          GATEWAY_URL: ${{ secrets.GATEWAY_URL || 'https://api.faazio.com' }}
          WEB_PORTAL_URL: ${{ vars.WEB_PORTAL_URL || secrets.WEB_PORTAL_URL || 'https://app.faazio.com' }}
          USE_GATEWAY: ${{ secrets.USE_GATEWAY || 'true' }}
          STRICT: "true"
          USE_FIREBASE_AUTH: "true"
          CERT_PINS: ${{ secrets.CERT_PINS }}
          APP_VARIANT: ${{ github.event.inputs.app }}
          GOOGLE_MAPS_API_KEY_IOS: ${{ secrets.GOOGLE_MAPS_API_KEY_IOS }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

      - name: Restore Apple signing certificate + provisioning profile
        id: signing
        run: bash scripts/restore-ios-signing.sh "${{ github.event.inputs.app }}"
        env:
          APPSTORE_CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATE_BASE64 }}
          APPSTORE_CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
          APPSTORE_TEAM_ID: ${{ vars.APPSTORE_TEAM_ID || secrets.APPSTORE_TEAM_ID }}
          APPSTORE_PROVISIONING_PROFILE_CUSTOMER: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_CUSTOMER }}
          APPSTORE_PROVISIONING_PROFILE_DELIVERY: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_DELIVERY }}
          APPSTORE_PROVISIONING_PROFILE_SELLER: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_SELLER }}

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Restore Swift Packages cache
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          # Xcode stores resolved SwiftPM repositories here. `.build` is only used
          # by the `swift build` CLI, not by an Xcode workspace archive, so it is
          # not cached. The key follows the tracked workspace resolver file and the
          # runner arch so Intel/arm64 caches (and binary artifacts) never mix.
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ env.XCODE_VERSION }}-${{ hashFiles('client/mobile/ios/Faazio.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ env.XCODE_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Archive
        # Archive without signing, then let `-exportArchive` apply the
        # distribution identity + App Store profile from ExportOptions.plist.
        # Passing PROVISIONING_PROFILE_SPECIFIER on the xcodebuild command line
        # applies it to every Pod/SPM target, which Xcode 26 rejects with
        # "<target> does not support provisioning profiles".
        # Optimizations (build settings must be xcodebuild arguments, not env vars):
        # - COMPILER_INDEX_STORE_ENABLE=NO: skips index-store generation for release
        # - -skipPackagePluginValidation -skipMacroValidation: avoids plugin/macro validation stalls
        # - -quiet: reduces log noise (warnings/errors still print)
        # - COMPILATION_CACHE_ENABLE_CACHING=YES: requests Xcode 26's compilation
        #   cache. Xcode logs "Compile caching is not supported with implicit
        #   modules", so it is a no-op for these pods until explicit modules are
        #   enabled; kept for when React Native supports them.
        run: |
          xcodebuild \
            -workspace ios/Faazio.xcworkspace \
            -scheme Faazio \
            -configuration "${{ steps.signing.outputs.configuration }}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Faazio.xcarchive" \
            -quiet \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            archive

      # Save the SPM cache before any sign/export/upload step. The combined
      # actions/cache post-step only runs on success, so a later TestFlight
      # failure used to discard the cache and make every retry re-fetch SPM.
      - name: Save Swift Packages cache
        if: ${{ always() && steps.spm-cache.outputs.cache-hit != 'true' && steps.spm-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Export signed .ipa
        id: export
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Faazio.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          echo "ipa_path=$IPA" >> "$GITHUB_OUTPUT"

      # Guard against a silently mis-signed build: the .app must verify AND carry an
      # Apple Distribution authority.
      - name: Verify the .ipa is signed for distribution
        run: |
          set -euo pipefail
          IPA="${{ steps.export.outputs.ipa_path }}"
          rm -rf "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"
          APP="$(ls -d "$RUNNER_TEMP"/ipa-check/Payload/*.app | head -1)"
          echo "ipa: $IPA"; echo "app: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/codesign.txt
          if ! grep -q "Apple Distribution" /tmp/codesign.txt; then
            echo "::error::the exported .app is not signed with an Apple Distribution certificate"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: faazio-${{ github.event.inputs.app }}-${{ github.event.inputs.version || 'release' }}-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload != 'false' }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.export.outputs.ipa_path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID || secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          # Do NOT pass `uses-non-exempt-encryption`. The archive's Info.plist
          # already carries ITSAppUsesNonExemptEncryption=false, so App Store
          # Connect sets compliance at upload. The action's follow-up PATCH then
          # fails with 409 "You cannot update when the value is already set",
          # which is what broke releases. Omitting the input skips that PATCH.

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP="${{ github.event.inputs.app }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$APP" == "delivery" ]]; then
            APP_NAME="Faazio Delivery Partner"
            TAG="v${VERSION}-delivery"
          elif [[ "$APP" == "seller" ]]; then
            APP_NAME="Faazio Seller Partner"
            TAG="v${VERSION}-seller"
          else
            APP_NAME="Faazio"
            TAG="v${VERSION}"
          fi
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          NOTES="Automated ${APP_NAME} iOS build via GitHub Actions.\n\nVersion: ${VERSION}\nBuild: ${{ steps.version.outputs.build_number }}\n"
          PRERELEASE=""
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            PRERELEASE="--prerelease"
          fi

          gh release create "$TAG" \
            --title "${APP_NAME} ${VERSION}" \
            --notes "$(printf "$NOTES")" \
            $PRERELEASE \
            || true

          gh release upload "$TAG" "${{ steps.export.outputs.ipa_path }}" --clobber

          echo "::notice::Published ${APP_NAME} ${VERSION} (build ${{ steps.version.outputs.build_number }}) iOS build to release ${TAG}"

      - name: Clean up signing keychain
        if: ${{ always() }}
        run: |
          security default-keychain -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" || true
