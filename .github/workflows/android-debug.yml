name: Android Debug APK

# Builds a debug APK entirely in GitHub Actions (no local Gradle / systemd-oomd
# risk) and uploads it as a downloadable artifact for device testing with a
# local Metro bundler:
#   gh workflow run android-debug.yml
#   gh run watch
#   gh run download <run-id> -n faazio-customer-debug-apk
#   adb install -r app-customer-debug.apk
#   adb reverse tcp:8081 tcp:8081   # then run `npm run start` in client/mobile
#
# Three products share this native shell. Pick `app: delivery` for the Delivery Partner app
# (com.faazio.deliverypartner) or `app: seller` for the Seller Partner app (com.faazio.seller).
# Each partner build needs its own Firebase Android config secret
# (`GOOGLE_SERVICES_DELIVERY_JSON` / `GOOGLE_SERVICES_SELLER_JSON`) so the google-services plugin
# can generate variant resources; the seller app itself authenticates through the web portal.
#
# The committed android/ project is the source of truth — no prebuild step.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Product to build"
        required: true
        type: choice
        options:
          - customer
          - delivery
          - seller
        default: customer
      archs:
        description: "ABIs to build (comma-separated)"
        required: false
        type: string
        default: "arm64-v8a"

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # RN + Gradle + npm need more headroom than the default runner image leaves.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images
          df -h

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle + setup Gradle build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Tune Gradle for CI runner
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC
          org.gradle.workers.max=4
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.vfs.watch=false
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Delivery Firebase config
        if: ${{ github.event.inputs.app == 'delivery' }}
        env:
          GOOGLE_SERVICES_DELIVERY_JSON: ${{ secrets.GOOGLE_SERVICES_DELIVERY_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_DELIVERY_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_DELIVERY_JSON is not set. Register com.faazio.deliverypartner in Firebase and store its google-services.json as the secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_DELIVERY_JSON" > android/app/src/delivery/google-services.json

      - name: Seller Firebase config
        if: ${{ github.event.inputs.app == 'seller' }}
        env:
          GOOGLE_SERVICES_SELLER_JSON: ${{ secrets.GOOGLE_SERVICES_SELLER_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_SELLER_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_SELLER_JSON is not set. Register com.faazio.seller in Firebase and store its google-services.json as the secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_SELLER_JSON" > android/app/src/seller/google-services.json

      - name: Typecheck
        run: npm run ts:check
        env:
          # ts:check re-runs configure.js; keep the selected product variant from being reset.
          # This runs before the live config step so it cannot overwrite the gateway/auth settings.
          APP_VARIANT: ${{ github.event.inputs.app }}

      - name: Generate JS/native config
        run: npm run configure
        env:
          # Debug APKs talk to the Render production gateway by default (override with a
          # repository variable/secret). Firebase phone auth needs the committed native config.
          GATEWAY_URL: ${{ vars.GATEWAY_URL || 'https://faazio-workspace.onrender.com' }}
          USE_GATEWAY: "true"
          STRICT: "true"
          USE_FIREBASE_AUTH: "true"
          APP_VARIANT: ${{ github.event.inputs.app }}
          GOOGLE_MAPS_API_KEY_ANDROID: ${{ vars.GOOGLE_MAPS_API_KEY_ANDROID || secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
          GOOGLE_PLACES_API_KEY: ${{ vars.GOOGLE_PLACES_API_KEY || secrets.GOOGLE_PLACES_API_KEY }}

      - name: Build debug APK
        run: |
          cd android
          case "${{ github.event.inputs.app }}" in
            delivery) TASK=assembleDeliveryDebug ;;
            seller) TASK=assembleSellerDebug ;;
            *) TASK=assembleCustomerDebug ;;
          esac
          ./gradlew "$TASK" --no-daemon \
            -PreactNativeArchitectures="${{ github.event.inputs.archs }}"
        env:
          ENTRY_FILE: ${{ github.event.inputs.app == 'delivery' && 'index.delivery.js' || (github.event.inputs.app == 'seller' && 'index.seller.js' || 'index.js') }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: faazio-${{ github.event.inputs.app }}-debug-apk
          path: client/mobile/android/app/build/outputs/apk/${{ github.event.inputs.app }}/debug/*.apk
          if-no-files-found: error
