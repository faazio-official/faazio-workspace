# Codemagic CI/CD — Faazio iOS customer App Store release.
#
# The GitHub Actions workflow (.github/workflows/ios-release.yml) is disabled
# (kept for history); this file is the production iOS release pipeline. It ports
# the same stages: npm ci -> checks -> version/build number -> release config ->
# resolve packages -> signing setup + archive + export -> verification ->
# TestFlight upload. Signing, archiving and export share one step because each
# Codemagic step gets a fresh shell/session (keychain state does not survive).
#
# One-time setup (Codemagic UI):
#   1. Add this repository as an application and select the branch to build.
#   2. Create the environment variable group `ios app` with the Apple
#      credentials, certificate pins and Google keys listed in
#      docs/RUNBOOKS/IOS_RELEASE_WITHOUT_MACOS.md.
#   3. Click "Check for configuration file" in the top-right corner.
#
# Trigger: manual only (Start new build). The `version` input overrides
# package.json; leaving it blank uses the committed version.

workflows:
  ios-customer-release:
    name: iOS Customer Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: client/mobile
    labels:
      - iOS
      - customer
      - App Store
    inputs:
      version:
        description: "Release version (e.g. 1.0.6). Leave blank to use package.json."
        type: string
        default: ""
    environment:
      # Xcode 26.3 ships Swift >= 6.2.1, required by Firebase iOS SDK 13
      # (resolved through SPM by @react-native-firebase 27).
      xcode: 26.3
      node: 24
      cocoapods: default
      groups:
        - "ios app"
      vars:
        APP_VARIANT: customer
        CONFIGURE_PLATFORM: ios
        GATEWAY_URL: https://api.faazio.com
        WEB_PORTAL_URL: https://app.faazio.com
        USE_GATEWAY: "true"
        STRICT: "true"
        USE_FIREBASE_AUTH: "true"
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install JS dependencies
        script: npm ci

      - name: Typecheck + module boundaries + UI hygiene
        script: |
          set -euo pipefail
          npm run ts:check
          npm run check:boundaries
          npm run check:ui

      - name: Set version and build number
        # Aligns the iOS marketing version + build number with the resolved
        # version. Info.plist reads $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION),
        # so this is the single source of truth for the submitted build.
        script: |
          set -euo pipefail
          VERSION="${{ inputs.version }}" node -e '
            const fs = require("fs");
            const p = require("./package.json");
            const version = process.env.VERSION || p.version;
            if (process.env.VERSION) {
              p.version = process.env.VERSION;
              fs.writeFileSync("./package.json", JSON.stringify(p, null, 2) + "\n");
            }
            const now = new Date();
            const pad = (n) => String(n).padStart(2, "0");
            const vc = String(now.getUTCFullYear()) + pad(now.getUTCMonth() + 1) +
              pad(now.getUTCDate()) + pad(now.getUTCHours()) + pad(now.getUTCMinutes());
            const f = "ios/Faazio.xcodeproj/project.pbxproj";
            let s = fs.readFileSync(f, "utf8");
            s = s.replace(/MARKETING_VERSION = [^;]+;/g, "MARKETING_VERSION = " + version + ";");
            s = s.replace(/CURRENT_PROJECT_VERSION = \d+;/g, "CURRENT_PROJECT_VERSION = " + vc + ";");
            fs.writeFileSync(f, s);
            console.log("MARKETING_VERSION=" + version + " CURRENT_PROJECT_VERSION=" + vc);
          '

      - name: Generate JS/native config (release)
        # CERT_PINS and the Maps/Places keys come from the ios app
        # group; REQUIRE_CERT_PINS=1 makes a missing pin set fatal.
        script: |
          set -euo pipefail
          export CONFIGURE_RELEASE=1
          export REQUIRE_CERT_PINS=1
          npm run configure

      - name: Install CocoaPods
        script: |
          set -euo pipefail
          cd ios
          pod install

      - name: Resolve Swift packages
        # Codemagic caches ~/Library/Caches/org.swift.swiftpm across builds. If a
        # previous run saved an incomplete cache, the archive can fail midway.
        # Resolve explicitly so a bad cache fails here with a clear error instead.
        script: |
          set -euo pipefail
          cd ios
          xcodebuild -resolvePackageDependencies \
            -workspace Faazio.xcworkspace \
            -scheme Faazio

      - name: Set up signing, archive and export .ipa
        # One step for the whole signing flow: Codemagic starts each script in a
        # fresh shell/session, so the temporary keychain, the installed profile,
        # the app project's signing settings and the export must all be used here.
        #
        # `xcode-project use-profiles` is Codemagic's supported setup: it applies
        # the installed App Store profile to the Faazio app target only (never to
        # node_modules projects) and writes the export options plist that
        # -exportArchive must use. A hand-written plist is only a fallback.
        script: |
          set -euo pipefail
          export RUNNER_TEMP="$CM_BUILD_DIR/build/ios/tmp"
          mkdir -p "$RUNNER_TEMP"
          export KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          bash scripts/restore-ios-signing.sh customer

          echo "--- keychains ---"
          security list-keychains -d user
          echo "--- signing identities ---"
          security find-identity -v -p codesigning
          echo "--- installed profiles ---"
          ls -l "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          ls -l "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" || true

          xcode-project use-profiles \
            --project ios/Faazio.xcodeproj \
            --export-options-plist "$HOME/export_options.plist" \
            --archive-method app-store \
            --custom-export-options '{"uploadSymbols": true, "stripSwiftSymbols": true, "compileBitcode": false}' \
            --warn-only

          EXPORT_OPTS="$HOME/export_options.plist"
          if [ -f "$EXPORT_OPTS" ]; then
            # Xcode 26 asks for "iOS Distribution" while the certificate is named
            # "Apple Distribution"; pin the exact identity by SHA-1 fingerprint.
            CERT_SHA1="$(cat "$RUNNER_TEMP/identity-sha1")"
            plutil -replace signingCertificate -string "$CERT_SHA1" "$EXPORT_OPTS" 2>/dev/null || \
              plutil -insert signingCertificate -string "$CERT_SHA1" "$EXPORT_OPTS"
            echo "--- generated ExportOptions.plist ---"
            plutil -p "$EXPORT_OPTS"
          else
            EXPORT_OPTS="ios/ExportOptions.plist"
            echo "warning: xcode-project did not generate export options; using the script-generated plist"
            plutil -p "$EXPORT_OPTS"
          fi

          mkdir -p "$CM_BUILD_DIR/build/ios/xcarchive"
          xcodebuild \
            -workspace ios/Faazio.xcworkspace \
            -scheme Faazio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/Faazio.xcarchive" \
            -quiet \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/ios-signing.keychain-db" \
            xcodebuild \
              -exportArchive \
              -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/Faazio.xcarchive" \
              -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
              -exportOptionsPlist "$EXPORT_OPTS"

      - name: Verify the .ipa is signed for distribution
        # The .app must verify AND carry an Apple Distribution authority.
        script: |
          set -euo pipefail
          IPA="$(ls "$CM_BUILD_DIR"/build/ios/ipa/*.ipa | head -1)"
          rm -rf "$CM_BUILD_DIR/build/ios/ipa-check"
          unzip -q "$IPA" -d "$CM_BUILD_DIR/build/ios/ipa-check"
          APP="$(ls -d "$CM_BUILD_DIR"/build/ios/ipa-check/Payload/*.app | head -1)"
          echo "ipa: $IPA"
          echo "app: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/codesign.txt
          if ! grep -q "Apple Distribution" /tmp/codesign.txt; then
            echo "The exported .app is not signed with an Apple Distribution certificate"
            exit 1
          fi

      - name: Upload to TestFlight
        # Codemagic's built-in `publishing.app_store_connect` step hands the
        # stored secret straight to the CLI. A key that was pasted into a
        # single-line UI field (literal "\n" escapes, quotes, CRLF) then fails
        # with "Provided value ... is not a valid PEM encoded private key".
        # Normalise and validate the key here, then upload it explicitly from a
        # real .p8 file.
        script: |
          set -euo pipefail
          source scripts/ios-appstore-key.sh
          IPA="$(ls "$CM_BUILD_DIR"/build/ios/ipa/*.ipa | head -1)"
          echo "Uploading $IPA to App Store Connect (TestFlight)"
          app-store-connect publish \
            --path "$IPA" \
            --key-id "$APPSTORE_KEY_ID" \
            --issuer-id "$APPSTORE_ISSUER_ID" \
            --private-key "@file:$APPSTORE_KEY_FILE"

      - name: Clean up signing keychain
        ignore_failure: true
        script: |
          security default-keychain -s login.keychain-db || true
          security delete-keychain "$CM_BUILD_DIR/build/ios/tmp/ios-signing.keychain-db" || true
    artifacts:
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
