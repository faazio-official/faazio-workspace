# Local dev stack for the Faazio MVP monolith. Mirrors the managed services:
#   Postgres  <-> Supabase      (migrations + seed applied on first boot)
#   Valkey    <-> Aiven Valkey
#   MongoDB   <-> Atlas M0      (sdui_layouts seeded)
#
#   docker compose up --build
#   curl localhost:8080/health
#   curl 'localhost:8080/search?q=coffee'
#
# Dev auth is open: AUTH_DISABLED=true, user = user-1 (or X-Dev-User header).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: faazio
      POSTGRES_DB: faazio
    ports:
      - "5432:5432"
    volumes:
      - ../supabase/migrations/0001_mvp_schemas.sql:/docker-entrypoint-initdb.d/0001_schemas.sql:ro
      - ../supabase/migrations/0002_fts_search.sql:/docker-entrypoint-initdb.d/0002_fts.sql:ro
      - ../supabase/migrations/0003_inventory_ttl_rls.sql:/docker-entrypoint-initdb.d/0003_ttl_rls.sql:ro
      - ../supabase/migrations/0004_lean_indexes.sql:/docker-entrypoint-initdb.d/0004_lean_indexes.sql:ro
      - ../supabase/migrations/0005_lean_types.sql:/docker-entrypoint-initdb.d/0005_lean_types.sql:ro
      - ../supabase/migrations/0006_idempotency.sql:/docker-entrypoint-initdb.d/0006_idempotency.sql:ro
      - ../supabase/migrations/0007_favourites.sql:/docker-entrypoint-initdb.d/0007_favourites.sql:ro
      - ../supabase/migrations/0008_rewards.sql:/docker-entrypoint-initdb.d/0008_rewards.sql:ro
      - ../supabase/migrations/0009_prescriptions.sql:/docker-entrypoint-initdb.d/0009_prescriptions.sql:ro
      - ../supabase/migrations/0010_blood.sql:/docker-entrypoint-initdb.d/0010_blood.sql:ro
      - ../supabase/migrations/0011_bookings.sql:/docker-entrypoint-initdb.d/0011_bookings.sql:ro
      - ../supabase/migrations/0012_payments_pickup.sql:/docker-entrypoint-initdb.d/0012_payments_pickup.sql:ro
      - ../supabase/migrations/0013_menus_venues.sql:/docker-entrypoint-initdb.d/0013_menus_venues.sql:ro
      - ../supabase/migrations/0014_hardening.sql:/docker-entrypoint-initdb.d/0014_hardening.sql:ro
      - ../supabase/migrations/0015_partner_control.sql:/docker-entrypoint-initdb.d/0015_partner_control.sql:ro
      - ../supabase/migrations/0016_store_live.sql:/docker-entrypoint-initdb.d/0016_store_live.sql:ro
      - ../supabase/migrations/0017_partner_complete.sql:/docker-entrypoint-initdb.d/0017_partner_complete.sql:ro
      - ../supabase/migrations/0018_rx_quote_notify.sql:/docker-entrypoint-initdb.d/0018_rx_quote_notify.sql:ro
      - ../supabase/migrations/0019_app_gaps.sql:/docker-entrypoint-initdb.d/0019_app_gaps.sql:ro
      - ../supabase/migrations/0020_booking_seats_platform_fee.sql:/docker-entrypoint-initdb.d/0020_booking_seats_platform_fee.sql:ro
      - ../supabase/migrations/0021_public_promos.sql:/docker-entrypoint-initdb.d/0021_public_promos.sql:ro
      - ../supabase/seed/0001_seed.sql:/docker-entrypoint-initdb.d/0099_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faazio"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    environment:
      MONGO_DATABASE: faazio
    ports:
      - "27017:27017"
    volumes:
      - ../supabase/seed/mongo/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  gateway:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      GATEWAY_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:faazio@postgres:5432/faazio?sslmode=disable"
      VALKEY_URL: "redis://valkey:6379/0"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "faazio"
      AUTH_DISABLED: "true"
      DEV_USER_ID: "user-1"
      ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"