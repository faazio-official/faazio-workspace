# Local dev stack for the Faazio production monolith. Mirrors the managed services:
#   Postgres  <-> Supabase      (migrations + seed applied on first boot)
#   Valkey    <-> Aiven Valkey
#   MongoDB   <-> Atlas M0      (sdui_layouts seeded)
#
#   docker compose up --build
#   curl localhost:8080/health
#   curl 'localhost:8080/search?q=coffee'
#
# Auth: every protected route requires a verified bearer token (AUTH_DISABLED/DEV_USER_ID are not
# read by the Go gateway). For local seller registration without Firebase, set SUPABASE_JWT_SECRET
# and drive the flow with scripts/simulate-seller-registration.sh (locally minted HS256 tokens).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: faazio
      POSTGRES_DB: faazio
    ports:
      - "5432:5432"
    volumes:
      # The whole migrations directory is mounted (read-only) and applied by the committed init
      # wrapper below, so new migrations are picked up automatically (no per-file list to keep in
      # sync) and the seed always runs last. ON_ERROR_STOP fails the boot on a bad statement.
      - ../supabase/migrations:/migrations:ro
      - ../supabase/seed:/seed:ro
      - ./scripts/compose-postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faazio"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    environment:
      MONGO_DATABASE: faazio
    ports:
      - "27017:27017"
    volumes:
      - ../supabase/seed/mongo/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  gateway:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      GATEWAY_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:faazio@postgres:5432/faazio?sslmode=disable"
      VALKEY_URL: "redis://valkey:6379/0"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "faazio"
      # Firebase phone-OTP verification (optional). For local seller registration without Firebase,
      # set SUPABASE_JWT_SECRET and use scripts/simulate-seller-registration.sh instead.
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
      SUPABASE_JWT_SECRET: "${SUPABASE_JWT_SECRET:-}"
      ALLOWED_ORIGINS: "http://localhost:3000"
      # Portal auth (POST /auth/portal/*, /admin/portal-users). Empty = 503 portal_auth_unavailable;
      # generate both before `up` to exercise real sign-in locally:
      #   PORTAL_JWT_SECRET=$(openssl rand -base64 48) PORTAL_PEPPER=$(openssl rand -base64 32) docker compose up --build
      # Seed a superadmin with tools/hash-password. See docs/RUNBOOKS/PORTAL_AUTH.md.
      PORTAL_JWT_SECRET: "${PORTAL_JWT_SECRET:-}"
      PORTAL_PEPPER: "${PORTAL_PEPPER:-}"
    ports:
      - "8080:8080"